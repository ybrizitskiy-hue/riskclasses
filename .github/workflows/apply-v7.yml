name: Apply v7 provider Tennis fix

on:
  push:
    branches:
      - fix/provider-tennis-round-review-v7

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Fix provider Tennis mappings and round review policy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply packaged patch
        run: |
          cat .github/v7_part_00 .github/v7_part_01 .github/v7_part_02 .github/v7_part_03 | base64 -d > /tmp/v7_patch.tgz
          tar -xzf /tmp/v7_patch.tgz
      - name: Syntax and targeted regressions
        run: |
          node --check functions/lib/provider-tennis-rules.js
          node --check functions/lib/result-policy.js
          node --check functions/lib/deterministic.js
          node --check functions/lib/rules-bundle.js
          node --check functions/api/analyze-core.js
          node --check app.js
          node tests/provider-tennis-round-smoke.mjs
          node tests/event-id-global-smoke.mjs
          node tests/event-id-analyze-smoke.mjs
          node tests/routing-smoke.mjs
      - name: Commit applied patch
        run: |
          rm -f .github/v7_part_00 .github/v7_part_01 .github/v7_part_02 .github/v7_part_03 .github/workflows/apply-v7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix provider Tennis mappings and round review policy"
          git push origin HEAD:fix/provider-tennis-round-review-v7
