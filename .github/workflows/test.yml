name: Regression tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check routing.js
          node --check rules-manager.js
          node --check provider-manager.js
          node --check provider-badge.js
          node --check functions/api/analyze-core.js
          node --check functions/api/rules.js
          node --check functions/api/providers.js
          node --check functions/api/meta.js
          node --check functions/lib/admin.js
          node --check functions/lib/ai-client.js
          node --check functions/lib/provider-config.js
          node --check functions/lib/cloudflare-provider-admin.js
          node --check functions/lib/deterministic.js
          node --check functions/lib/rules-bundle.js
      - name: Routing regression
        run: node tests/routing-smoke.mjs
      - name: Admin routing regression
        run: node tests/admin-gate-smoke.mjs
      - name: Rules manager regression
        run: node tests/rules-manager-smoke.mjs
      - name: Provider manager regression
        run: node tests/provider-manager-smoke.mjs
      - name: Provider badge browser regression
        run: node tests/provider-badge-browser-smoke.mjs
      - name: Provider panel stability regression
        run: node tests/provider-panel-stability-smoke.mjs
