name: Apply Stage review UI test updates

on:
  push:
    branches:
      - fix/compact-results-stage-review

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Align Stage review tests and prompt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align prompt and regression expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('functions/api/analyze-core.js')
          s=p.read_text()
          s=s.replace("set manualCheck=true, and explicitly state 'Round/stage not provided — High confidence retained; manual check required for the applicable round.'", "set manualCheck=true, and explicitly state 'Stage/round not provided — High confidence retained; stage check required.'")
          s=s.replace('Do NOT escalate merely because a brand uses inherited Global or because Manual check is required only for a missing Tennis/Snooker round.', 'Do NOT escalate merely because a brand uses inherited Global or because a Stage check is required only for a missing Tennis/Snooker round.')
          p.write_text(s)

          p=Path('tests/provider-tennis-round-smoke.mjs')
          s=p.read_text()
          s=s.replace("assert(final.basis.includes(ROUND_REVIEW_REASON), `Screenshot row ${competitionId} must mention round review in Basis`);", "assert(!final.basis.includes(ROUND_REVIEW_REASON), `Screenshot row ${competitionId} must keep Basis compact`);")
          s=s.replace("assert(tennisNoRound.basis.includes(ROUND_REVIEW_REASON), 'Tennis round review reason must be visible in Basis');", "assert(!tennisNoRound.basis.includes(ROUND_REVIEW_REASON), 'Tennis round review reason must not duplicate into Basis');")
          s=s.replace("assert(appSource.includes(\"row.manualCheckReason || '—'\"), 'Results table must render manual check reason');", "assert(appSource.includes(\"manualCheckType: manualCheckReason ? 'Stage'\"), 'Results table must label round-only review as Stage');")
          s=s.replace("assert(html.includes('<th>Manual check reason</th>'), 'UI must display the manual check reason column');", "assert(!html.includes('<th>Manual check reason</th>'), 'UI must not add a separate reason column');")
          s=s.replace("assert(html.includes('Missing Tennis/Snooker exact round = High + manual check with reason'), 'UI policy must explicitly describe the exception');", "assert(html.includes('Missing Tennis/Snooker exact round = High + Stage check'), 'UI policy must explicitly describe the Stage exception');")
          p.write_text(s)

          p=Path('tests/event-id-global-smoke.mjs')
          s=p.read_text().replace('Missing Tennis/Snooker exact round = High + manual check with reason','Missing Tennis/Snooker exact round = High + Stage check')
          p.write_text(s)
          PY
      - name: Syntax and regressions
        run: |
          node --check app.js
          node --check functions/api/analyze-core.js
          node --check functions/lib/result-policy.js
          node --check tests/provider-tennis-round-smoke.mjs
          node tests/provider-tennis-round-smoke.mjs
          node tests/event-id-global-smoke.mjs
          node tests/event-id-analyze-smoke.mjs
          node tests/routing-smoke.mjs
          node tests/admin-gate-smoke.mjs
          node tests/rules-manager-smoke.mjs
          node tests/provider-manager-smoke.mjs
          node tests/chat-web-search-smoke.mjs
          node tests/prompt-cache-key-smoke.mjs
          node tests/reasoning-config-smoke.mjs
          node tests/reasoning-routing-smoke.mjs
          node tests/provider-badge-browser-smoke.mjs
          node tests/provider-panel-stability-smoke.mjs
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/api/analyze-core.js tests/provider-tennis-round-smoke.mjs tests/event-id-global-smoke.mjs
          git commit -m "Align Stage review tests and prompt"
          git push origin HEAD:fix/compact-results-stage-review
