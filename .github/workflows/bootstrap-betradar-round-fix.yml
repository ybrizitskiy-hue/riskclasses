name: Bootstrap Betradar Challenger and round review fix

on:
  push:
    branches:
      - fix/betradar-challenger-round-review

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/betradar-challenger-round-review
      - name: Apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/risk-fix.tar.gz
          echo "de8b403895fcafa753453606a5c43498dfbd18a5ef32438dbb681bb8fd2ee1bc  /tmp/risk-fix.tar.gz" | sha256sum -c -
          tar -xzf /tmp/risk-fix.tar.gz -C .
          node --check app.js
          node --check functions/api/analyze-core.js
          node --check functions/api/rules.js
          node --check functions/lib/input-contract.js
          node --check functions/lib/rules-bundle.js
          node tests/routing-smoke.mjs
          node tests/event-id-global-smoke.mjs
          node tests/event-id-analyze-smoke.mjs
          node tests/round-review-smoke.mjs
          node tests/rules-runtime-upgrade-smoke.mjs
          git restore --source=HEAD -- .github/workflows/smoke-tests.yml .github/workflows/test.yml
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-betradar-round-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Betradar Challenger mapping and round review"
          git push origin HEAD:fix/betradar-challenger-round-review
