name: Fix v3 routing expectation

on:
  push:
    branches:
      - feat/event-id-provider-tennis-global

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align routing smoke with latest intended v3 rule
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/routing-smoke.mjs')
          text = path.read_text(encoding='utf-8')
          old = "  ['MMA','Dana Whites Contender Series: Season 10 - UFC','RC D','RC D','RC D'],"
          new = "  ['MMA','Dana Whites Contender Series: Season 10 - UFC','RC E','RC E','RC E'],"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old Contender assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/fix-v3-routing-expectation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/routing-smoke.mjs .github/workflows/fix-v3-routing-expectation.yml
          git commit -m 'Align routing smoke with v3 MMA baseline'
          git push origin HEAD:feat/event-id-provider-tennis-global
