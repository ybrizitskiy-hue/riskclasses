name: Bootstrap event ID patch

on:
  push:
    branches:
      - feat/event-id-provider-tennis-global

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode patch files and commit
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/event-id-patch.tar.xz
          tar -xJf /tmp/event-id-patch.tar.xz
          rm -f .github/workflows/bootstrap-event-id.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/api/analyze-core.js functions/lib/rules-bundle.js tests/event-id-global-smoke.mjs .github/workflows/bootstrap-event-id.yml
          git commit -m 'Add event ID analysis core and tennis rules'
          git push origin HEAD:feat/event-id-provider-tennis-global
